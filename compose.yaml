services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      # Le montage du code ne doit jamais masquer les dépendances installées
      # dans l'image : un volume nommé persiste /app/node_modules.
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres_password@database:5432/universal_db}
      - NODE_ENV=${NODE_ENV:-development}
      - API_PORT=${API_PORT:-3000}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8081}
    # Ne réinstalle les dépendances que si le volume est vide ou obsolète,
    # puis démarre le serveur de développement.
    command: ["sh", "/app/docker-entrypoint.sh", "npm", "run", "dev"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  database:
    image: docker.io/postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-universal_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # :z applique l'étiquetage SELinux requis sur Fedora.
      - ./data/postgres:/var/lib/postgresql/data:z
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-universal_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  backend_node_modules:
