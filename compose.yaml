services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      # Le montage du code ne doit jamais masquer les dépendances installées
      # dans l'image : un volume nommé persiste /app/node_modules.
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres_password@database:5432/universal_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NODE_ENV=${NODE_ENV:-development}
      - API_PORT=${API_PORT:-3000}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8081}
    # Ne réinstalle les dépendances que si le volume est vide ou obsolète,
    # puis démarre le serveur de développement.
    command: ["sh", "/app/docker-entrypoint.sh", "npm", "run", "dev"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.API_PORT || 3000) + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  harvester:
    # Contexte racine : le schéma Drizzle partagé vit dans backend/src/db.
    build:
      context: .
      dockerfile: harvester/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres_password@database:5432/universal_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NODE_ENV=${NODE_ENV:-development}
      - HARVESTER_PORT=${HARVESTER_PORT:-3001}
      - HARVESTER_DB_POOL=${HARVESTER_DB_POOL:-5}
      - HARVESTER_ENABLE_EXAMPLE=${HARVESTER_ENABLE_EXAMPLE:-0}
      - HARVESTER_EXAMPLE_URL=${HARVESTER_EXAMPLE_URL:-}
    volumes:
      # Montage sélectif : monter ./harvester directement sur /app exposerait
      # le lien symbolique local shared-db -> ../backend/src/db (invalide dans
      # le conteneur) et ferait échouer le montage /app/shared-db sous crun.
      - ./harvester/src:/app/src:z
      - ./harvester/package.json:/app/package.json:ro,z
      - ./harvester/package-lock.json:/app/package-lock.json:ro,z
      - ./harvester/tsconfig.json:/app/tsconfig.json:ro,z
      - ./harvester/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro,z
      - harvester_node_modules:/app/node_modules
      # Source unique de vérité du schéma : le dossier backend est monté en
      # lecture seule et lu par src/db/schema.ts via /app/shared-db.
      - ./backend/src/db:/app/shared-db:ro,z
    command: ["sh", "/app/docker-entrypoint.sh", "npm", "run", "dev"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.HARVESTER_PORT || 3001) + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # :z garantit l'étiquetage SELinux en rootless.
      - ./data/redis:/data:z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  database:
    image: docker.io/postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-universal_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # :z applique l'étiquetage SELinux requis sur Fedora.
      - ./data/postgres:/var/lib/postgresql/data:z
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-universal_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  backend_node_modules:
  harvester_node_modules:
